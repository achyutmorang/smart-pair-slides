project:
  type: website
  output-dir: docs
  resources:
    - assets/videos/**
    - assets/diagrams/**
    - assets/figures/**
    - assets/plots/**

website:
  title: "Traffic Interaction Authenticity"
  site-url: "https://achyutmorang.github.io/smart-pair-slides/"

format:
  revealjs:
    theme: [default, styles.scss]
    slide-number: c/t
    chalkboard: true
    preview-links: auto
    code-line-numbers: false
    controls: true
    progress: true
    history: true
    center: false
    width: 1600
    height: 900
    margin: 0.055
    transition: none
    background-transition: none
    scrollable: true
    fig-align: center
    toc: false
    html-math-method: katex
    smaller: false
    footer: "Traffic Interaction Authenticity | Waymax-backed counterfactual simulation"
execute:
  echo: false
  warning: false
  message: false
bibliography: references.bib
