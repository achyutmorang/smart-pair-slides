<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Closed-loop realism versus counterfactual interaction response</title>
  <desc id="desc">A two-column conceptual diagram contrasting logged closed-loop rollout evaluation with interventional counterfactual response evaluation.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#263238"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .h { font: 700 22px Arial, sans-serif; fill: #111827; }
      .body { font: 18px Arial, sans-serif; fill: #263238; }
      .small { font: 15px Arial, sans-serif; fill: #374151; }
      .math { font: 18px "DejaVu Sans Mono", monospace; fill: #111827; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .soft { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .blue { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .green { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 8; }
      .red { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 8; }
      .amber { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 8; }
      .line { stroke: #263238; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#f8fafc"/>
  <text class="title" x="60" y="58">Why We Need A Counterfactual Evaluation Axis</text>
  <text class="body" x="60" y="92">Closed-loop realism asks whether generated traffic looks like logs. Counterfactual response asks whether agents react correctly when another agent is changed.</text>

  <rect class="card" x="60" y="135" width="510" height="460"/>
  <text class="h" x="90" y="178">Standard Closed-Loop Evaluation</text>
  <rect class="blue" x="92" y="215" width="170" height="70"/>
  <text class="body" x="118" y="258">History H + Map M</text>
  <path class="line" d="M270 250 H365"/>
  <rect class="green" x="375" y="215" width="150" height="70"/>
  <text class="body" x="410" y="246">Policy</text>
  <text class="small" x="407" y="268">pi_theta</text>
  <path class="line" d="M450 292 V365"/>
  <rect class="soft" x="130" y="375" width="350" height="72"/>
  <text class="body" x="162" y="406">Generated rollout compared to</text>
  <text class="body" x="195" y="430">logged future distribution</text>
  <text class="math" x="105" y="505">Question: p(tau_1:N | H, M)</text>
  <text class="small" x="105" y="540">Good for realism, map adherence, interaction plausibility, and covariate-shift recovery.</text>

  <rect class="card" x="630" y="135" width="510" height="460"/>
  <text class="h" x="660" y="178">Counterfactual Interaction Evaluation</text>
  <rect class="blue" x="662" y="215" width="165" height="70"/>
  <text class="body" x="688" y="258">History H + Map M</text>
  <path class="line" d="M835 250 H910"/>
  <rect class="red" x="920" y="215" width="170" height="70"/>
  <text class="body" x="948" y="246">Intervention</text>
  <text class="small" x="949" y="268">do(agent j)</text>
  <path class="line" d="M1005 292 V365"/>
  <rect class="amber" x="710" y="375" width="350" height="72"/>
  <text class="body" x="735" y="406">Other agents must respond under</text>
  <text class="body" x="795" y="430">the changed condition</text>
  <text class="math" x="675" y="505">Question: p(tau_-j | H, M, do(tau_j = tau_tilde_j))</text>
  <text class="small" x="675" y="540">Good for diagnosing yield/go, brake/continue, gap acceptance, and non-interference.</text>

  <rect class="soft" x="235" y="620" width="730" height="38"/>
  <text class="body" x="258" y="646">Thesis gap: high realism is necessary, but it does not certify interventional response quality.</text>
</svg>
