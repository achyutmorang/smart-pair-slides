<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <style>
      text { font-family: Avenir Next, Helvetica, Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 34px; font-weight: 800; }
      .subtitle { font-size: 19px; fill: #475569; }
      .panel-title { font-size: 25px; font-weight: 800; }
      .box-title { font-size: 20px; font-weight: 700; }
      .small { font-size: 16px; fill: #475569; }
      .smart { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .pair { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .eval { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
      .key { fill: #f8fafc; stroke: #475569; stroke-width: 2; }
      .arrow { stroke: #334155; stroke-width: 2; marker-end: url(#arrow); fill: none; }
      .dash { stroke-dasharray: 8 6; }
    </style>
  </defs>
  <rect width="1500" height="820" fill="#ffffff" />
  <text x="750" y="54" text-anchor="middle" class="title">SMART vs SMART-PAIR: What Changes?</text>
  <text x="750" y="86" text-anchor="middle" class="subtitle">Same tokenized SMART generator at inference; SMART-PAIR adds a training-time future-interaction latent objective.</text>

  <rect x="80" y="130" width="560" height="530" rx="18" class="smart" opacity="0.95" />
  <text x="360" y="172" text-anchor="middle" class="panel-title">SMART</text>
  <rect x="180" y="215" width="360" height="64" rx="10" class="key" />
  <text x="360" y="242" text-anchor="middle" class="box-title">Inputs</text>
  <text x="360" y="265" text-anchor="middle" class="small">map + agents + history</text>
  <rect x="180" y="325" width="360" height="64" rx="10" class="key" />
  <text x="360" y="352" text-anchor="middle" class="box-title">Discrete Motion / Road Tokens</text>
  <text x="360" y="375" text-anchor="middle" class="small">language-like driving tokens</text>
  <rect x="180" y="435" width="360" height="64" rx="10" class="key" />
  <text x="360" y="462" text-anchor="middle" class="box-title">Decoder-Style Transformer</text>
  <text x="360" y="485" text-anchor="middle" class="small">temporal + interaction + map attention</text>
  <rect x="180" y="545" width="360" height="64" rx="10" class="key" />
  <text x="360" y="572" text-anchor="middle" class="box-title">Next-Token Loss</text>
  <text x="360" y="595" text-anchor="middle" class="small">optimize p(next token | context)</text>
  <path d="M360 279 L360 325" class="arrow" />
  <path d="M360 389 L360 435" class="arrow" />
  <path d="M360 499 L360 545" class="arrow" />

  <rect x="860" y="130" width="560" height="530" rx="18" class="pair" opacity="0.95" />
  <text x="1140" y="172" text-anchor="middle" class="panel-title">SMART-PAIR</text>
  <rect x="960" y="215" width="360" height="64" rx="10" class="key" />
  <text x="1140" y="242" text-anchor="middle" class="box-title">Same Inputs And Tokens</text>
  <text x="1140" y="265" text-anchor="middle" class="small">no tokenizer or inference-path change</text>
  <rect x="960" y="325" width="360" height="64" rx="10" class="key" />
  <text x="1140" y="352" text-anchor="middle" class="box-title">Same SMART Generator</text>
  <text x="1140" y="375" text-anchor="middle" class="small">same deployed rollout architecture</text>
  <rect x="900" y="470" width="260" height="64" rx="10" class="key" />
  <text x="1030" y="497" text-anchor="middle" class="box-title">Next-Token Loss</text>
  <text x="1030" y="520" text-anchor="middle" class="small">standard SMART objective</text>
  <rect x="1200" y="470" width="180" height="64" rx="10" class="pair" />
  <text x="1290" y="497" text-anchor="middle" class="box-title">PAIR Loss</text>
  <text x="1290" y="520" text-anchor="middle" class="small">training only</text>
  <rect x="960" y="570" width="360" height="64" rx="10" class="key" />
  <text x="1140" y="597" text-anchor="middle" class="box-title">Autoregressive Rollout</text>
  <text x="1140" y="620" text-anchor="middle" class="small">uses only the SMART generator at inference</text>
  <path d="M1140 279 L1140 325" class="arrow" />
  <path d="M1115 389 L1030 470" class="arrow" />
  <path d="M1165 389 L1290 470" class="arrow dash" />
  <path d="M1030 534 L1100 570" class="arrow" />
  <path d="M1290 534 L1180 570" class="arrow dash" />

  <rect x="525" y="705" width="450" height="70" rx="14" class="eval" />
  <text x="750" y="734" text-anchor="middle" class="box-title">Compare Under The Same Evaluator</text>
  <text x="750" y="758" text-anchor="middle" class="small">WOSAC-style realism + counterfactual stress + representation probes</text>
  <path d="M360 609 C360 690 520 700 590 720" class="arrow" />
  <path d="M1140 634 C1140 700 970 705 910 720" class="arrow" />
</svg>
